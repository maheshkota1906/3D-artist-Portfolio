      /* Lightbox Styles */
      .folder-card {
        display: inline-block;
        background: #1e1e1e;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        margin: 10px;
      }
      .folder-card img {
        width: 300px;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
      }
      .folder-card:hover {
        transform: translateY(-5px);
        box-shadow: 0px 4px 20px rgba(246, 1, 1, 0.327);
      }

      .lightbox {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
        z-index: 1000;
      }
      .lightbox-content .slide {
        display: none;
        text-align: center;
      }
      .lightbox-content .slide img {
        width: 80%;
        max-width: 600px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .slide.active { display: block; }
      .prev, .next {
        cursor: pointer;
        position: absolute;
        top: 50%;
        font-size: 40px;
        color: white;
        user-select: none;
        padding: 10px;
      }
      .prev { left: 30px; }
      .next { right: 30px; }
      .close {
        position: absolute; top: 20px; right: 30px;
        font-size: 30px; color: white; cursor: pointer;
      }
      .profile-link {
        text-align: center;
        margin: 20px 0;
      }
      .profile-link a {
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        padding: 10px 20px;
        background-color: #333;
        border-radius: 5px;
        transition: background-color 0.3s;
      }
      .profile-link a:hover {
        background-color: #555;
      }

      /* Skills section: technical skills first, software below */

        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 26px 16px;
        align-items: start;

        width: 100%;

  <script>
    // Lightbox Script
    let slideIndex = 0;
    function openGallery(id) {
      const gallery = document.getElementById(id);
      if (!gallery) return;
      gallery.style.display = "flex";
      document.body.style.overflow = "hidden";
    }
    function closeGallery(id) {
      const gallery = document.getElementById(id);
      if (gallery) gallery.style.display = "none";
      if (!document.querySelector('.lightbox[style*="display: flex"]')) {
        document.body.style.overflow = "";
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        document.querySelectorAll(".lightbox").forEach(function(gallery) {
          gallery.style.display = "none";
        });
        document.body.style.overflow = "";
      }
    });
    // Mobile navigation functions
    function openNav() {
      document.getElementById("mobile-nav").style.width = "100%";
    }
    function closeNav() {
      document.getElementById("mobile-nav").style.width = "0%";
    }
  </script>
